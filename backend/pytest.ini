[pytest]
# 测试根目录固定在 backend/，避免从仓库根目录跑时收集错路径
testpaths = tests

# --strict-markers：未注册的 marker 直接报错。
# 之前没有这个文件，test_migrations_sync.py 用的 @pytest.mark.slow
# 一直是未注册状态（只打 PytestUnknownMarkWarning，不会失败），
# 于是"慢用例"这个分类其实从来没生效过。
addopts = --strict-markers -q

markers =
    slow: 需要跑完整迁移/较长耗时，本地可 -m "not slow" 跳过

# asyncio_mode=auto：以后新增 async 测试不必逐个加 @pytest.mark.asyncio。
# 注意现有用例是自己用 asyncio.run() 驱动的，不依赖这个开关。
asyncio_mode = auto

filterwarnings =
    # anyio 的 BlockingPortal 别名弃用来自 starlette 的 TestClient，
    # 不是我们能修的；显式忽略，避免淹没真正的告警。
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
