# PestGuard Nginx 站点配置模板
#
# 用法：
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/pestguard
#   sudo sed -i 's/your-domain.com/你的实际域名/g' /etc/nginx/sites-available/pestguard
#   sudo ln -s /etc/nginx/sites-available/pestguard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：静态落地页与 API 都在 8000 端口，这里只做一层反向代理。

# HTTP：先做 ACME 校验，其余全部跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Certbot 校验路径，必须在跳转规则之前
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    # SSL 证书（由 certbot 自动生成，首次申请前先注释掉这两行）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 上传体积上限需大于后端限制（图片 10MB / 视频 100MB）
    client_max_body_size 120m;

    # 超时放宽：视频检测是异步的，但合成结果可能较慢
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 预留（后续若加流式输出需开启）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    access_log /var/log/nginx/pestguard.access.log;
    error_log  /var/log/nginx/pestguard.error.log;
}
