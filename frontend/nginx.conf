server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限需大于后端限制（图片 10MB / 视频 100MB）
    client_max_body_size 110m;

    # Vite 产物带内容哈希，可以放心长缓存；index.html 不能缓存，
    # 否则发新版后浏览器一直用旧的入口文件去请求已删除的 hash 资源。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 必须转发真实客户端 IP。
        # 后端 get_client_ip() 只在 TRUST_PROXY=true 时才读这两个头；
        # 少了它们，后端看到的永远是本 nginx 容器的内网 IP，
        # 于是登录/注册限流（10 次/分钟）退化成**全局共享配额** ——
        # 三个评委同时注册，第三个人直接 429。
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频检测是异步的，但上传与同步检测可能较慢，超时放宽
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
